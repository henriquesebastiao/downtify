# Local development compose (build from source).
# For production with the published image, use: cp docker-compose.example.yml docker-compose.yml
services:
  downtify:
    container_name: downtify
    image: 'downtify:${TAG-latest}'
    restart: unless-stopped
    build: .
    ports:
      - '8000:30321'
    volumes:
      # If slskd runs elsewhere, mount the SAME host folder as slskd at /slskd
      # and set Settings → slskd → folder path to /slskd.
      - ./docker/downloads:/downloads
      # - ./docker/slskd:/slskd
      - ./docker/data:/data
      # - ./docker/cookies.txt:/cookies.txt
    environment:
      - DOWNTIFY_PORT=30321
      # https://downtify.henriquesebastiao.com/getting-started/environment-variables/#getting-a-cookiestxt
      # - DOWNTIFY_COOKIES_FILE=/cookies.txt
      # - TZ=America/Sao_Paulo
      # - DOWNTIFY_MONITOR_SYNC_TIME=03:00
    dns:
      - 1.1.1.1
      - 1.0.0.1
