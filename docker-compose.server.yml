# Production compose for a home server: MeTube (yt-dlp backend) +
# Downtify (search UI + Similar via Last.fm) + Navidrome (streamer).
# One shared music folder, per-service data folders next to this file.
#
# First start:  docker compose -f docker-compose.server.yml up -d
# Then open Downtify (:8082), sign in as admin and paste the free
# Last.fm key (last.fm/api/account/create) in
# Settings → Audio sources → Last.fm. The key is stored in
# downtify_data/settings.json — keep that folder.

services:
  # Бэкэнд yt-dlp + веб-клиент. Также поддерживает интеграцию через расширения браузера
  metube:
    image: ghcr.io/alexta69/metube:latest
    container_name: music-downloader-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      # Единая папка для музыки на вашем сервере
      - ./my_music_folder:/downloads
    environment:
      - DOWNLOAD_TYPE=audio
      - AUDIO_FORMAT=mp3
      - OUTPUT_TEMPLATE=%(artist)s - %(title)s.%(ext)s

  # Рабочий интерфейс для поиска музыки по YouTube и Spotify
  # + страница Similar (похожие треки через Last.fm)
  downtify:
    # ВАЖНО: образ собирается из ВАШЕГО репозитория (этот код),
    # а не качается оригинальный ghcr.io/henriquesebastiao/downtify.
    # Без секции build ниже на сервер встанет оригинальная версия без Similar.
    build:
      context: .
      dockerfile: Dockerfile
    image: downtify:similar
    container_name: music-search-ui
    restart: unless-stopped
    ports:
      - "8082:8000"
    volumes:
      # Подключаем ту же папку для сохранения треков через Downtify
      - ./my_music_folder:/downloads
      # Настройки, очередь, БД библиотеки — и Last.fm API ключ (settings.json) тоже здесь.
      # Не удаляйте эту папку, иначе ключ придётся вводить заново
      - ./downtify_data:/data
    environment:
      - DOWNTIFY_DISABLE_AUTH=false
    depends_on:
      - metube

  # Раздатчик и стриминговый плеер для вашей скачанной музыки
  navidrome:
    image: deluan/navidrome:latest
    container_name: music-streamer-server
    restart: unless-stopped
    ports:
      - "4533:4533"
    volumes:
      # Читает файлы mp3 из той же общей папки
      - ./my_music_folder:/music:ro
      # Папка для базы данных самого Navidrome
      - ./navidrome_data:/data
    environment:
      - ND_LOGLEVEL=info
      - ND_SCANSCHEDULE=@every 1m # Сканирует общую папку на новые треки каждую минуту
    depends_on:
      - metube
