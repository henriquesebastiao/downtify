version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 1 1 * *"
      timezone: "America/Sao_Paulo"
    assignees:
      - "henriquesebastiao"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 1 1 * *"
      timezone: "America/Sao_Paulo"
    assignees:
      - "henriquesebastiao"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 1 1 * *"
      timezone: "America/Sao_Paulo"
    assignees:
      - "henriquesebastiao"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 1 1 * *"
      timezone: "America/Sao_Paulo"
    assignees:
      - "henriquesebastiao"
    exclude-paths:
       - "requirements.txt"