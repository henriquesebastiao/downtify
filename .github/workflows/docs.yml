name: Documentation
on:
  push:
    branches:
      - master
      - main
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
        with:
          # Full history, for each page's "Last updated" date.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci --prefix docs
      - run: npm test --prefix docs
      # Fails on dead links and broken anchors.
      - run: npm run build --prefix docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist
  # A job of its own, as in GitHub's Pages starter: deploy-pages called
  # in the same job, right after the upload, sometimes listed the run's
  # artifacts before the new one showed up ("Found 0 artifact(s)").
  deploy:
    needs: build
    environment:
      name: docs
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
