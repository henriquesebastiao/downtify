on: [push, pull_request]

name: Test

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: downtify_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      UV_SYSTEM_PYTHON: 1
      PYTHON_COLORS: 0
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'

    steps:
      - name: Copy files from repo
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.5'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock
            requirements-music-ai-tests.txt

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --frozen --all-extras --dev

      - name: Run Ruff
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .

      - name: Install native audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Verify FFmpeg, FFprobe and Rubber Band
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -version
          ffprobe -hide_banner -version
          ffmpeg -hide_banner -filters > "${RUNNER_TEMP}/downtify-ffmpeg-filters.txt"
          grep -E '(^|[[:space:]])rubberband[[:space:]]' "${RUNNER_TEMP}/downtify-ffmpeg-filters.txt"
          ffmpeg -v error -f lavfi -i "sine=frequency=440:duration=0.5:sample_rate=44100" -af "rubberband=tempo=1.01" -f null -

      - name: Run pytest (SQLite)
        run: |
          uv pip install --python .venv/bin/python -r requirements-music-ai-tests.txt
          uv run --no-sync pytest -x -s -v

      - name: Run pytest (PostgreSQL)
        run: uv run pytest -x -s -v
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/downtify_test

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test
