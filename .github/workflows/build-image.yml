name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repo Name
        run: |
          echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
          build-args: |
            DOWNTIFY_OIDC_ISSUER=${{ secrets.DOWNTIFY_OIDC_ISSUER }}
            DOWNTIFY_OIDC_CLIENT_ID=${{ secrets.DOWNTIFY_OIDC_CLIENT_ID }}
            DOWNTIFY_OIDC_CLIENT_SECRET=${{ secrets.DOWNTIFY_OIDC_CLIENT_SECRET }}
            DOWNTIFY_OIDC_REDIRECT_URI=${{ secrets.DOWNTIFY_OIDC_REDIRECT_URI }}
            DOWNTIFY_OIDC_ADMIN_GROUPS=${{ secrets.DOWNTIFY_OIDC_ADMIN_GROUPS }}
