name: Add to project

on:
  issues:
    types: [opened, reopened, transferred]
  # pull_request_target so PRs from forks also get the secret. The job
  # never checks out the PR's code, so it's safe.
  pull_request_target:
    types: [opened, reopened]

jobs:
  add-to-project:
    name: Add issue or pull request to project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v2
        with:
          project-url: https://github.com/users/henriquesebastiao/projects/24
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
